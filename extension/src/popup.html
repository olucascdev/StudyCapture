<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>StudyCapture</title></head><body>
<main class="shell"><header class="masthead"><span class="mark">SC</span><div><p class="eyebrow">caderno de aula</p><h1>StudyCapture</h1></div><span id="signal" class="signal" title="servidor"></span></header>
<section id="preparation" class="panel"><div class="section-label">Preparação</div><label>Título<input id="title" maxlength="300" autocomplete="off"></label><label>Pasta do vault<select id="folder"><option value="">Raiz do vault</option></select></label><label>Idioma<select id="language"><option value="">Automático</option><option value="pt">Português</option><option value="en">English</option></select></label><p id="availability" class="status-line">Verificando servidor…</p><button id="start" class="primary" disabled>Começar captura <span>↗</span></button></section>
<section id="capturing" class="panel hidden"><div class="recording-row"><span class="record-dot"></span><div><div class="section-label">Capturando agora</div><strong id="capture-title"></strong></div></div><div id="duration" class="duration">00:00</div><div class="meter"><span id="meter-fill"></span></div><div class="stats"><span><b id="blocks">0</b> blocos enviados</span><span><b id="pending">0</b> pendentes</span></div><button id="finish" class="danger">Finalizar captura</button></section>
<section id="completion" class="panel hidden"><div class="section-label">Processamento</div><h2 id="completion-title">Sua nota está sendo montada</h2><p id="completion-copy">Os blocos continuam seguros no servidor.</p><div id="note-path" class="note-path hidden"></div><button id="open-note" class="primary hidden">Abrir no Obsidian <span>↗</span></button><button id="new-capture" class="quiet">Nova captura</button></section>
<section id="history" class="history"><div class="section-label">Últimas capturas</div><div id="history-list" class="history-list"><p class="muted">Nenhuma captura ainda.</p></div></section><footer><button id="settings" class="quiet">Configurações</button><span id="error" class="error"></span></footer></main><script type="module" src="./popup.ts"></script></body></html>
